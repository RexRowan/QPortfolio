<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="640" height="320" fill="#EEF3F9"/>

  <!-- circuit A -->
  <text x="60" y="90" font-family="JetBrains Mono, monospace" font-size="13" fill="#14171F">before</text>
  <line x1="60" y1="130" x2="260" y2="130" stroke="#2B6CB0" stroke-width="2.5"/>
  <line x1="60" y1="180" x2="260" y2="180" stroke="#2B6CB0" stroke-width="2.5"/>
  <rect x="100" y="112" width="36" height="36" fill="#EEF3F9" stroke="#14171F" stroke-width="2.5"/>
  <text x="112" y="135" font-family="JetBrains Mono, monospace" font-size="14" fill="#14171F">H</text>
  <rect x="170" y="162" width="36" height="36" fill="#EEF3F9" stroke="#14171F" stroke-width="2.5"/>
  <text x="182" y="185" font-family="JetBrains Mono, monospace" font-size="14" fill="#14171F">X</text>

  <!-- transpile arrow -->
  <path d="M300,155 L360,155" stroke="#0F9D8C" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="295" y="140" font-family="JetBrains Mono, monospace" font-size="11" fill="#0F9D8C">transpile</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F9D8C"/>
    </marker>
  </defs>

  <!-- circuit B (transpiled, different gates) -->
  <text x="400" y="90" font-family="JetBrains Mono, monospace" font-size="13" fill="#14171F">after</text>
  <line x1="400" y1="130" x2="600" y2="130" stroke="#2B6CB0" stroke-width="2.5"/>
  <line x1="400" y1="180" x2="600" y2="180" stroke="#2B6CB0" stroke-width="2.5"/>
  <rect x="430" y="112" width="36" height="36" fill="#EEF3F9" stroke="#14171F" stroke-width="2.5"/>
  <text x="438" y="135" font-family="JetBrains Mono, monospace" font-size="12" fill="#14171F">RZ</text>
  <rect x="490" y="112" width="36" height="36" fill="#EEF3F9" stroke="#14171F" stroke-width="2.5"/>
  <text x="500" y="135" font-family="JetBrains Mono, monospace" font-size="12" fill="#14171F">SX</text>
  <rect x="520" y="162" width="36" height="36" fill="#EEF3F9" stroke="#14171F" stroke-width="2.5"/>
  <text x="530" y="185" font-family="JetBrains Mono, monospace" font-size="12" fill="#14171F">RZ</text>

  <!-- equivalence check -->
  <circle cx="320" cy="240" r="18" fill="#EEF3F9" stroke="#0F9D8C" stroke-width="2.5"/>
  <path d="M312,240 L318,247 L330,232" stroke="#0F9D8C" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="270" y="275" font-family="JetBrains Mono, monospace" font-size="12" fill="#14171F">same unitary, verified</text>
</svg>
