<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="640" height="320" fill="#EEF3F9"/>

  <text x="40" y="45" font-family="JetBrains Mono, monospace" font-size="13" fill="#14171F">Circuit, scored across candidate backends</text>

  <!-- circuit icon on the left -->
  <g stroke="#2B6CB0" stroke-width="2">
    <line x1="50" y1="150" x2="150" y2="150"/>
    <line x1="50" y1="185" x2="150" y2="185"/>
  </g>
  <g fill="#FFFFFF" stroke="#14171F" stroke-width="1.5">
    <rect x="75" y="138" width="22" height="22"/>
    <rect x="120" y="173" width="22" height="22"/>
  </g>
  <circle cx="108" cy="150" r="5" fill="#14171F"/>
  <line x1="108" y1="150" x2="108" y2="185" stroke="#14171F" stroke-width="1.5"/>

  <!-- arrow to scorer -->
  <path d="M160,167 L215,167" stroke="#0F9D8C" stroke-width="3" fill="none" marker-end="url(#arrowLB)"/>
  <defs>
    <marker id="arrowLB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F9D8C"/>
    </marker>
  </defs>

  <!-- scorer box -->
  <rect x="220" y="132" width="120" height="70" fill="none" stroke="#14171F" stroke-width="1.5"/>
  <text x="232" y="160" font-family="JetBrains Mono, monospace" font-size="11" fill="#14171F">queue depth +</text>
  <text x="232" y="176" font-family="JetBrains Mono, monospace" font-size="11" fill="#14171F">noise-aware</text>
  <text x="232" y="192" font-family="JetBrains Mono, monospace" font-size="11" fill="#14171F">fidelity estimate</text>

  <!-- arrows out to three backends -->
  <path d="M345,150 L400,110" stroke="#0F9D8C" stroke-width="2" fill="none" marker-end="url(#arrowLB)"/>
  <path d="M345,167 L400,167" stroke="#0F9D8C" stroke-width="2" fill="none" marker-end="url(#arrowLB)"/>
  <path d="M345,184 L400,224" stroke="#0F9D8C" stroke-width="2" fill="none" marker-end="url(#arrowLB)"/>

  <!-- three backend bars -->
  <g font-family="JetBrains Mono, monospace" font-size="11" fill="#14171F">
    <rect x="410" y="95" width="130" height="30" fill="#0F9D8C" fill-opacity="0.15" stroke="#0F9D8C" stroke-width="2"/>
    <text x="418" y="114" font-weight="bold">ibm_fez · 0.77</text>

    <rect x="410" y="152" width="80" height="30" fill="none" stroke="#14171F" stroke-width="1.5"/>
    <text x="418" y="171">ibm_kingston · 0.59</text>

    <rect x="410" y="209" width="78" height="30" fill="none" stroke="#14171F" stroke-width="1.5"/>
    <text x="418" y="228">ibm_marrakesh · 0.59</text>
  </g>

  <text x="410" y="255" font-family="JetBrains Mono, monospace" font-size="11" fill="#0F9D8C">→ routed to top pick, fails over on error</text>

  <text x="40" y="290" font-family="JetBrains Mono, monospace" font-size="11" fill="#14171F">Verified against a real QiskitRuntimeService submission (ibm_fez, 3s)</text>
</svg>
