<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="640" height="320" fill="#EEF3F9"/>

  <text x="60" y="60" font-family="JetBrains Mono, monospace" font-size="13" fill="#14171F">logical</text>
  <circle cx="90" cy="110" r="14" fill="#EEF3F9" stroke="#2B6CB0" stroke-width="2.5"/>
  <text x="85" y="115" font-family="JetBrains Mono, monospace" font-size="11" fill="#14171F">q0</text>
  <circle cx="160" cy="110" r="14" fill="#EEF3F9" stroke="#2B6CB0" stroke-width="2.5"/>
  <text x="155" y="115" font-family="JetBrains Mono, monospace" font-size="11" fill="#14171F">q1</text>
  <circle cx="90" cy="180" r="14" fill="#EEF3F9" stroke="#2B6CB0" stroke-width="2.5"/>
  <text x="85" y="185" font-family="JetBrains Mono, monospace" font-size="11" fill="#14171F">q2</text>
  <line x1="90" y1="110" x2="160" y2="110" stroke="#2B6CB0" stroke-width="2"/>
  <line x1="90" y1="110" x2="90" y2="180" stroke="#2B6CB0" stroke-width="2"/>

  <path d="M240,140 L340,140" stroke="#0F9D8C" stroke-width="3" fill="none" marker-end="url(#arrow2)"/>
  <text x="235" y="125" font-family="JetBrains Mono, monospace" font-size="11" fill="#0F9D8C">layout + route</text>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F9D8C"/>
    </marker>
  </defs>

  <text x="400" y="60" font-family="JetBrains Mono, monospace" font-size="13" fill="#14171F">hardware coupling map</text>
  <circle cx="420" cy="110" r="10" fill="#14171F"/>
  <circle cx="480" cy="90" r="10" fill="#14171F"/>
  <circle cx="540" cy="110" r="10" fill="#14171F"/>
  <circle cx="450" cy="160" r="10" fill="#14171F"/>
  <circle cx="510" cy="160" r="10" fill="#14171F"/>
  <circle cx="570" cy="160" r="10" fill="#14171F"/>
  <circle cx="480" cy="210" r="10" fill="#14171F"/>
  <circle cx="540" cy="210" r="10" fill="#14171F"/>
  <g stroke="#B8C2D0" stroke-width="1.5">
    <line x1="420" y1="110" x2="480" y2="90"/>
    <line x1="480" y1="90" x2="540" y2="110"/>
    <line x1="420" y1="110" x2="450" y2="160"/>
    <line x1="480" y1="90" x2="510" y2="160"/>
    <line x1="540" y1="110" x2="570" y2="160"/>
    <line x1="450" y1="160" x2="510" y2="160"/>
    <line x1="510" y1="160" x2="570" y2="160"/>
    <line x1="450" y1="160" x2="480" y2="210"/>
    <line x1="510" y1="160" x2="540" y2="210"/>
  </g>
  <!-- mapped qubits highlighted -->
  <circle cx="480" cy="90" r="12" fill="none" stroke="#2B6CB0" stroke-width="2.5"/>
  <circle cx="540" cy="110" r="12" fill="none" stroke="#2B6CB0" stroke-width="2.5"/>
  <circle cx="450" cy="160" r="12" fill="none" stroke="#2B6CB0" stroke-width="2.5"/>
  <line x1="480" y1="90" x2="540" y2="110" stroke="#0F9D8C" stroke-width="2.5"/>
  <line x1="480" y1="90" x2="450" y2="160" stroke="#0F9D8C" stroke-width="2.5"/>

  <text x="400" y="270" font-family="JetBrains Mono, monospace" font-size="12" fill="#14171F">min-cost mapping under coupling constraints</text>
</svg>
