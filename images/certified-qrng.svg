<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="640" height="320" fill="#EEF3F9"/>

  <!-- Bell-pair circuit: q0, q1 -->
  <text x="46" y="104" font-family="JetBrains Mono, monospace" font-size="13" fill="#14171F">q0</text>
  <text x="46" y="154" font-family="JetBrains Mono, monospace" font-size="13" fill="#14171F">q1</text>
  <line x1="72" y1="100" x2="230" y2="100" stroke="#2B6CB0" stroke-width="2.5"/>
  <line x1="72" y1="150" x2="230" y2="150" stroke="#2B6CB0" stroke-width="2.5"/>

  <!-- H gate on q0 -->
  <rect x="90" y="84" width="32" height="32" fill="#EEF3F9" stroke="#14171F" stroke-width="2.5"/>
  <text x="99" y="106" font-family="JetBrains Mono, monospace" font-size="15" fill="#14171F">H</text>

  <!-- CX entangling q0,q1 -->
  <line x1="160" y1="100" x2="160" y2="150" stroke="#14171F" stroke-width="2.5"/>
  <circle cx="160" cy="100" r="5" fill="#14171F"/>
  <circle cx="160" cy="150" r="14" fill="#EEF3F9" stroke="#14171F" stroke-width="2.5"/>
  <line x1="150" y1="150" x2="170" y2="150" stroke="#14171F" stroke-width="2.5"/>
  <line x1="160" y1="140" x2="160" y2="160" stroke="#14171F" stroke-width="2.5"/>

  <!-- measurement rotations + meters -->
  <rect x="188" y="84" width="32" height="32" fill="#EEF3F9" stroke="#14171F" stroke-width="2.5"/>
  <text x="193" y="106" font-family="JetBrains Mono, monospace" font-size="11" fill="#14171F">Ry</text>
  <rect x="188" y="134" width="32" height="32" fill="#EEF3F9" stroke="#14171F" stroke-width="2.5"/>
  <text x="193" y="156" font-family="JetBrains Mono, monospace" font-size="11" fill="#14171F">Ry</text>

  <!-- arrow to S readout -->
  <path d="M234,125 L280,125" stroke="#0F9D8C" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F9D8C"/>
    </marker>
  </defs>

  <!-- S / min-entropy readout -->
  <rect x="292" y="95" width="110" height="60" fill="#14171F"/>
  <text x="305" y="118" font-family="JetBrains Mono, monospace" font-size="13" fill="#F7F7F5">S = 2.77</text>
  <text x="305" y="140" font-family="JetBrains Mono, monospace" font-size="11" fill="#0F9D8C">H∞ ≥ 0.63 bit</text>

  <!-- arrow to extractor -->
  <path d="M406,125 L452,125" stroke="#0F9D8C" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Toeplitz extractor box -->
  <rect x="464" y="90" width="110" height="70" fill="#EEF3F9" stroke="#14171F" stroke-width="2.5"/>
  <text x="475" y="115" font-family="JetBrains Mono, monospace" font-size="12" fill="#14171F">Toeplitz</text>
  <text x="475" y="132" font-family="JetBrains Mono, monospace" font-size="12" fill="#14171F">extractor</text>
  <text x="475" y="150" font-family="JetBrains Mono, monospace" font-size="11" fill="#2B6CB0">1011010…</text>

  <text x="46" y="250" font-family="JetBrains Mono, monospace" font-size="14" fill="#14171F">CHSH-certified min-entropy, Toeplitz-extracted, Lean-checked</text>
</svg>
