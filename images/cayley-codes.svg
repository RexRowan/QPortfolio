<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="640" height="320" fill="#EEF3F9"/>

  <text x="60" y="55" font-family="JetBrains Mono, monospace" font-size="13" fill="#14171F">Cayley graph on a group generating set</text>

  <!-- a small Cayley graph, cube-like Cayley graph of Z2^3-ish -->
  <g stroke="#2B6CB0" stroke-width="2">
    <line x1="180" y1="120" x2="300" y2="120"/>
    <line x1="180" y1="220" x2="300" y2="220"/>
    <line x1="180" y1="120" x2="180" y2="220"/>
    <line x1="300" y1="120" x2="300" y2="220"/>
    <line x1="240" y1="90" x2="360" y2="90"/>
    <line x1="240" y1="190" x2="360" y2="190"/>
    <line x1="240" y1="90" x2="240" y2="190"/>
    <line x1="360" y1="90" x2="360" y2="190"/>
    <line x1="180" y1="120" x2="240" y2="90"/>
    <line x1="300" y1="120" x2="360" y2="90"/>
    <line x1="180" y1="220" x2="240" y2="190"/>
    <line x1="300" y1="220" x2="360" y2="190"/>
  </g>
  <g fill="#14171F">
    <circle cx="180" cy="120" r="7"/>
    <circle cx="300" cy="120" r="7"/>
    <circle cx="180" cy="220" r="7"/>
    <circle cx="300" cy="220" r="7"/>
    <circle cx="240" cy="90" r="7"/>
    <circle cx="360" cy="90" r="7"/>
    <circle cx="240" cy="190" r="7"/>
    <circle cx="360" cy="190" r="7"/>
  </g>

  <path d="M410,155 L470,155" stroke="#0F9D8C" stroke-width="3" fill="none" marker-end="url(#arrow3)"/>
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F9D8C"/>
    </marker>
  </defs>

  <text x="490" y="100" font-family="JetBrains Mono, monospace" font-size="13" fill="#14171F">CSS code</text>
  <text x="490" y="125" font-family="JetBrains Mono, monospace" font-size="18" fill="#14171F">[[8,4,2]]</text>
  <rect x="490" y="145" width="120" height="18" fill="none" stroke="#0F9D8C" stroke-width="2"/>
  <rect x="490" y="167" width="120" height="18" fill="none" stroke="#0F9D8C" stroke-width="2"/>
  <text x="495" y="270" font-family="JetBrains Mono, monospace" font-size="11" fill="#14171F">Couvreur-Delfosse-Zémor construction</text>
</svg>
