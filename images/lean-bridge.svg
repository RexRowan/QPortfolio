<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="640" height="320" fill="#EEF3F9"/>

  <!-- left node: Qiskit gate identity -->
  <rect x="70" y="120" width="150" height="80" fill="none" stroke="#2B6CB0" stroke-width="2.5"/>
  <text x="90" y="155" font-family="JetBrains Mono, monospace" font-size="14" fill="#14171F">cx ==</text>
  <text x="90" y="178" font-family="JetBrains Mono, monospace" font-size="14" fill="#14171F">notc</text>

  <!-- bridge span -->
  <line x1="220" y1="160" x2="420" y2="160" stroke="#0F9D8C" stroke-width="3"/>
  <line x1="260" y1="160" x2="260" y2="140" stroke="#0F9D8C" stroke-width="2"/>
  <line x1="310" y1="160" x2="310" y2="140" stroke="#0F9D8C" stroke-width="2"/>
  <line x1="360" y1="160" x2="360" y2="140" stroke="#0F9D8C" stroke-width="2"/>
  <line x1="220" y1="160" x2="240" y2="140" stroke="#0F9D8C" stroke-width="2"/>
  <line x1="420" y1="160" x2="400" y2="140" stroke="#0F9D8C" stroke-width="2"/>

  <!-- right node: Lean lemma -->
  <rect x="420" y="120" width="150" height="80" fill="none" stroke="#7A6FF0" stroke-width="2.5"/>
  <text x="440" y="155" font-family="JetBrains Mono, monospace" font-size="13" fill="#14171F">theorem</text>
  <text x="440" y="178" font-family="JetBrains Mono, monospace" font-size="13" fill="#14171F">h_equiv : sorry</text>

  <!-- verified badge on the numeric-convention check -->
  <circle cx="320" cy="240" r="14" fill="#0F9D8C"/>
  <path d="M312,240 L318,247 L330,232" fill="none" stroke="#F7F7F5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="345" y="245" font-family="JetBrains Mono, monospace" font-size="13" fill="#14171F">convention verified numerically</text>
</svg>
