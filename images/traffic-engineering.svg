<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="640" height="320" fill="#EEF3F9"/>

  <text x="40" y="45" font-family="JetBrains Mono, monospace" font-size="13" fill="#14171F">Queued job, monitored — rerouted on SLA breach or outage</text>

  <!-- job box, still queued -->
  <rect x="45" y="110" width="140" height="60" fill="#FFFFFF" stroke="#14171F" stroke-width="1.5"/>
  <text x="58" y="132" font-family="JetBrains Mono, monospace" font-size="11" fill="#14171F">job: QUEUED</text>
  <text x="58" y="148" font-family="JetBrains Mono, monospace" font-size="11" fill="#B0413E">waited 12m34s</text>
  <text x="58" y="162" font-family="JetBrains Mono, monospace" font-size="10" fill="#14171F">on ibm_kingston</text>

  <!-- arrow to decision -->
  <path d="M190,140 L245,140" stroke="#0F9D8C" stroke-width="3" fill="none" marker-end="url(#arrowTE)"/>
  <defs>
    <marker id="arrowTE" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F9D8C"/>
    </marker>
  </defs>

  <!-- decision diamond -->
  <polygon points="320,105 385,140 320,175 255,140" fill="none" stroke="#14171F" stroke-width="1.5"/>
  <text x="270" y="135" font-family="JetBrains Mono, monospace" font-size="10" fill="#14171F">SLA breached</text>
  <text x="283" y="148" font-family="JetBrains Mono, monospace" font-size="10" fill="#14171F">or outage?</text>

  <!-- arrow to cancel+resubmit -->
  <path d="M388,140 L440,140" stroke="#0F9D8C" stroke-width="3" fill="none" marker-end="url(#arrowTE)"/>
  <text x="392" y="130" font-family="JetBrains Mono, monospace" font-size="10" fill="#0F9D8C">yes</text>

  <!-- new backend box -->
  <rect x="445" y="105" width="150" height="60" fill="#0F9D8C" fill-opacity="0.15" stroke="#0F9D8C" stroke-width="2"/>
  <text x="458" y="127" font-family="JetBrains Mono, monospace" font-size="11" fill="#14171F" font-weight="bold">ibm_marrakesh</text>
  <text x="458" y="143" font-family="JetBrains Mono, monospace" font-size="11" fill="#14171F">RUNNING</text>
  <text x="458" y="157" font-family="JetBrains Mono, monospace" font-size="10" fill="#0F9D8C">reroute #1</text>

  <!-- "no" path looping back to waiting -->
  <path d="M320,178 Q320,220 190,220 Q120,220 115,172" stroke="#B0B8C4" stroke-width="1.5" fill="none" marker-end="url(#arrowTE)"/>
  <text x="330" y="235" font-family="JetBrains Mono, monospace" font-size="10" fill="#14171F">no — keep waiting</text>

  <!-- pinned job example -->
  <rect x="45" y="250" width="300" height="45" fill="none" stroke="#14171F" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="58" y="268" font-family="JetBrains Mono, monospace" font-size="11" fill="#14171F">📌 pinned job: ibm_fez, QUEUED</text>
  <text x="58" y="283" font-family="JetBrains Mono, monospace" font-size="10" fill="#14171F">never rerouted, regardless of SLA or outage</text>

  <text x="400" y="270" font-family="JetBrains Mono, monospace" font-size="11" fill="#14171F">Verified end-to-end on real hardware</text>
  <text x="400" y="285" font-family="JetBrains Mono, monospace" font-size="11" fill="#14171F">(ibm_kingston → ibm_marrakesh, DONE)</text>
</svg>
