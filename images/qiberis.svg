  <line x1="360" y1="160" x2="560" y2="160" stroke="#0F9D8C" stroke-width="3"/>
  <rect x="432" y="152" width="16" height="16" fill="none" stroke="#14171F" stroke-width="2"/>
  <text x="565" y="165" font-family="JetBrains Mono, monospace" font-size="15" fill="#14171F">Cirq</text>

  <line x1="360" y1="230" x2="560" y2="230" stroke="#7A6FF0" stroke-width="3"/>
  <polygon points="440,220 450,230 440,240 430,230" fill="none" stroke="#14171F" stroke-width="2"/>
  <text x="565" y="234" font-family="JetBrains Mono, monospace" font-size="15" fill="#14171F">PennyLane</text>

  <circle cx="60" cy="160" r="4" fill="#14171F"/>
