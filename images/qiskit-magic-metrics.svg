<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="640" height="320" fill="#EEF3F9"/>

  <text x="40" y="45" font-family="JetBrains Mono, monospace" font-size="13" fill="#14171F">Clifford circuit → stabilizer tableau → exact metrics</text>

  <!-- circuit icon: H, S, CX -->
  <g stroke="#2B6CB0" stroke-width="2">
    <line x1="45" y1="140" x2="150" y2="140"/>
    <line x1="45" y1="175" x2="150" y2="175"/>
  </g>
  <rect x="60" y="128" width="22" height="22" fill="#FFFFFF" stroke="#14171F" stroke-width="1.5"/>
  <text x="66" y="144" font-family="JetBrains Mono, monospace" font-size="12" fill="#14171F">H</text>
  <rect x="95" y="163" width="22" height="22" fill="#FFFFFF" stroke="#14171F" stroke-width="1.5"/>
  <text x="100" y="179" font-family="JetBrains Mono, monospace" font-size="12" fill="#14171F">S</text>
  <circle cx="135" cy="140" r="4.5" fill="#14171F"/>
  <line x1="135" y1="140" x2="135" y2="175" stroke="#14171F" stroke-width="1.5"/>
  <circle cx="135" cy="175" r="7" fill="none" stroke="#14171F" stroke-width="1.5"/>

  <!-- arrow to tableau -->
  <path d="M158,157 L205,157" stroke="#0F9D8C" stroke-width="3" fill="none" marker-end="url(#arrowMM)"/>
  <defs>
    <marker id="arrowMM" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F9D8C"/>
    </marker>
  </defs>

  <!-- GF(2) stabilizer tableau grid -->
  <g>
    <rect x="212" y="118" width="88" height="78" fill="#FFFFFF" stroke="#14171F" stroke-width="1.5"/>
    <g stroke="#B9C4D6" stroke-width="1">
      <line x1="234" y1="118" x2="234" y2="196"/>
      <line x1="256" y1="118" x2="256" y2="196"/>
      <line x1="278" y1="118" x2="278" y2="196"/>
      <line x1="212" y1="138" x2="300" y2="138"/>
      <line x1="212" y1="158" x2="300" y2="158"/>
      <line x1="212" y1="178" x2="300" y2="178"/>
    </g>
    <text x="220" y="132" font-family="JetBrains Mono, monospace" font-size="10" fill="#0F9D8C">1</text>
    <text x="242" y="152" font-family="JetBrains Mono, monospace" font-size="10" fill="#0F9D8C">0</text>
    <text x="264" y="172" font-family="JetBrains Mono, monospace" font-size="10" fill="#0F9D8C">1</text>
    <text x="220" y="192" font-family="JetBrains Mono, monospace" font-size="10" fill="#0F9D8C">1</text>
    <text x="284" y="132" font-family="JetBrains Mono, monospace" font-size="10" fill="#0F9D8C">0</text>
  </g>
  <text x="212" y="212" font-family="JetBrains Mono, monospace" font-size="10" fill="#14171F">GF(2) tableau</text>

  <!-- arrows to three metrics -->
  <path d="M304,140 L360,105" stroke="#0F9D8C" stroke-width="2" fill="none" marker-end="url(#arrowMM)"/>
  <path d="M304,157 L360,157" stroke="#0F9D8C" stroke-width="2" fill="none" marker-end="url(#arrowMM)"/>
  <path d="M304,174 L360,209" stroke="#0F9D8C" stroke-width="2" fill="none" marker-end="url(#arrowMM)"/>

  <!-- three metric boxes -->
  <g font-family="JetBrains Mono, monospace" font-size="11" fill="#14171F">
    <rect x="368" y="88" width="220" height="32" fill="none" stroke="#14171F" stroke-width="1.5"/>
    <text x="378" y="108">Stabilizer Rényi Entropy (magic)</text>

    <rect x="368" y="141" width="220" height="32" fill="none" stroke="#14171F" stroke-width="1.5"/>
    <text x="378" y="161">Meyer-Wallach Measure</text>

    <rect x="368" y="194" width="220" height="32" fill="none" stroke="#14171F" stroke-width="1.5"/>
    <text x="378" y="214">Entanglement Entropy</text>
  </g>

  <text x="368" y="248" font-family="JetBrains Mono, monospace" font-size="11" fill="#0F9D8C">exact, polynomial time — no statevector construction</text>

  <text x="40" y="290" font-family="JetBrains Mono, monospace" font-size="11" fill="#14171F">General statevector path also available for non-Clifford circuits</text>
</svg>
