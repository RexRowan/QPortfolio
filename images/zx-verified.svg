<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="640" height="320" fill="#EEF3F9"/>

  <!-- two Z-spiders fusing along a wire, before -->
  <line x1="70" y1="160" x2="170" y2="160" stroke="#2B6CB0" stroke-width="2.5"/>
  <line x1="170" y1="160" x2="270" y2="160" stroke="#2B6CB0" stroke-width="2.5"/>
  <line x1="270" y1="160" x2="330" y2="160" stroke="#2B6CB0" stroke-width="2.5"/>
  <circle cx="170" cy="160" r="16" fill="#EEF3F9" stroke="#14171F" stroke-width="2.5"/>
  <circle cx="270" cy="160" r="16" fill="#EEF3F9" stroke="#14171F" stroke-width="2.5"/>
  <text x="163" y="165" font-family="JetBrains Mono, monospace" font-size="12" fill="#14171F">α</text>
  <text x="263" y="165" font-family="JetBrains Mono, monospace" font-size="12" fill="#14171F">β</text>

  <!-- fusion arrow -->
  <path d="M360,160 L420,160" stroke="#0F9D8C" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F9D8C"/>
    </marker>
  </defs>

  <!-- fused spider, after -->
  <line x1="450" y1="160" x2="510" y2="160" stroke="#2B6CB0" stroke-width="2.5"/>
  <line x1="570" y1="160" x2="610" y2="160" stroke="#2B6CB0" stroke-width="2.5"/>
  <circle cx="540" cy="160" r="18" fill="#0F9D8C" stroke="#14171F" stroke-width="2.5"/>
  <line x1="540" y1="160" x2="570" y2="160" stroke="#2B6CB0" stroke-width="2.5"/>
  <text x="528" y="165" font-family="JetBrains Mono, monospace" font-size="12" fill="#F7F7F5">α+β</text>

  <text x="70" y="250" font-family="JetBrains Mono, monospace" font-size="14" fill="#14171F">Clifford phase-gate fusion, Lean-verified rewrite</text>
</svg>
